# ak45_ros2 / ak45_node 파라미터
# '/**' 와일드카드: 노드명·네임스페이스가 바뀌어도 그대로 적용된다.
# 전부 런타임 변경 불가 — 노드가 add_on_set_parameters_callback 을 구현하지 않는다.
/**:
  ros__parameters:
    # ── Phase 1 : 상태 발행 ────────────────────────────────────────────────
    # 상태 발행 주기(Hz). 0 < x <= 500. 피드백 업로드 상한 500Hz [매뉴얼 p.44]
    publish_rate_hz: 50.0

    # 진단 발행 주기(Hz). 0 < x <= 50. 표준 진단 도구 관례는 1~2Hz (§6.2)
    diagnostics_rate_hz: 2.0

    # AK45 CAN ID 0x01~0x06 순서와 1:1 대응. 정확히 6개. 중복 이름 금지.
    # /ak45/command 의 name[] 도 이 목록과 문자열 매칭한다.
    # URDF 확정 전 임시값 (부록 C 10-2)
    joint_names:
      - "ak45_1"
      - "ak45_2"
      - "ak45_3"
      - "ak45_4"
      - "ak45_5"
      - "ak45_6"

    # ── Phase 2 : 명령 수신 ────────────────────────────────────────────────
    # 명령 재송신 주기(Hz). 0 < x <= 50. 기본 10.0 = 100ms.
    # 라이브러리에 재송신 루프가 없고 ak45_set_position() 1회 = CAN 프레임 1개다
    # (부록 B C3). 재송신을 멈추면 모터 쪽 명령 타임아웃으로 홀딩 토크가 풀린다.
    # 값을 올릴 이유는 없다.
    command_resend_rate_hz: 10.0

    # 목표각 절대값 상한(도). 0 < x <= 360.
    # 넘는 값은 클램프가 아니라 '거부'한다 — 클램프하면 사람이 잘못 보낸 것을
    # 모르는 채로 모터가 상한까지 움직여버린다.
    #
    # 2026-08-27 기준축 판별 완료 (ERPM 대조법, ros2.md §13.10):
    #   위치 피드백은 **출력축 기준**이다. NPP ≈ 14.
    #   -> 여기 적는 값이 곧 **실제 출력축 회전 각도**다.
    #      90.0  = 출력축 1/4 바퀴
    #      180.0 = 출력축 반 바퀴
    #      360.0 = 출력축 한 바퀴
    #
    # ⚠️ 올리기 전에 출력축에 무엇이 붙어 있는지 반드시 확인한다.
    #    맨 축이면 360.0 까지 안전. 링크·기구부가 붙어 있으면
    #    물리적으로 허용되는 각도까지만 올린다.
    # 2026-08-27 90도까지 실기 검증 완료 (도달오차 +0.1도, 최대전류 0.47A).
    # 출력축에 유의미한 부하가 없는 것이 전류로 확인되어 라이브러리 상한까지 연다.
    # 360.0 = 출력축 한 바퀴. 이보다 크게는 못 준다(SOFT_LIMIT_POS_DEG 360.0f).
    max_command_deg: 360.0

    # 명령 타임아웃(초). 0.0 = 타임아웃 없음(마지막 목표를 계속 홀딩).
    # 0보다 크면 그 시간 동안 새 명령이 없을 때 재송신을 멈춘다.
    # 기본 0.0 인 이유: 강화학습 정책이 끊겨도 팔이 갑자기 힘을 놓으면 중력으로
    # 떨어진다. 홀딩 유지가 기본이고, 끊김 감지는 사람이 켠다.
    command_timeout_sec: 0.0

    # 온도 상한(℃). 이 값 이상인 모터는 재송신 대상에서 제외된다.
    # 한 번 걸리면 온도가 내려가도 자동 복귀하지 않는다 — 노드를 재시작해야 한다.
    # 실측 이력상 무부하(전류 0A)에서도 26 -> 53℃ 까지 올랐고 원인이 미상이라
    # 보수적으로 간다. 2026-08-27 기준 현재 온도가 53℃ 라 여유가 7℃ 뿐이다.
    max_temperature_c: 60.0
